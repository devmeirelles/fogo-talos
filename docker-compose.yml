name: talos

services:
  talos-postgres:
    image: postgres:17-alpine
    container_name: talos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talos}
      POSTGRES_USER: ${POSTGRES_USER:-talos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talos}
    ports:
      - "5432:5432"
    volumes:
      - talos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  talos-redis:
    image: redis:7-alpine
    container_name: talos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - talos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talos-postgres-data:
  talos-redis-data:
